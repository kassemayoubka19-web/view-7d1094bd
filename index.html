<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dddeda">
  <title> </title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#dddeda}
    model-viewer{display:block;width:100%;height:100%;height:100dvh;background:#dddeda;touch-action:none;--poster-color:#dddeda;outline:none}
    model-viewer::part(default-progress-bar){height:2px;background:#8b9291}
    model-viewer::part(default-ar-button){display:none}
  </style>
  <script type="module" src="./model-viewer.min.js"></script>
</head>
<body>
  <model-viewer src="./model.glb" alt="3D" camera-controls interaction-prompt="none" environment-image="neutral" exposure="1" shadow-intensity="1" shadow-softness="1" camera-orbit="-35deg 38deg auto" field-of-view="38deg" min-camera-orbit="auto 0deg auto" max-camera-orbit="auto 90deg auto" touch-action="none" loading="eager" reveal="auto"></model-viewer>
</body>
</html>
